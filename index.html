<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriderm Sales Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { background-color: #000000; color: #ececec; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Thin Sidebar */
        #sidebar {
            width: 65px;
            background-color: #000000;
            border-right: 1px solid #2F2F2F;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
        }

        .icon-btn {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            color: #b4b4b4;
            cursor: pointer;
            margin-bottom: 5px;
            font-size: 1.2rem;
            transition: background-color 0.2s;
        }
        .icon-btn:hover { background-color: #2f2f2f; color: white; }

        /* Main Chat Area */
        #main-container { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }
        #chat-history { flex-grow: 1; overflow-y: auto; padding: 2rem 20%; display: flex; flex-direction: column; gap: 20px; }
        
        /* Message Bubbles */
        .msg-user { align-self: flex-end; background-color: #2b5278; color: white; padding: 10px 18px; border-radius: 20px; max-width: 75%; word-wrap: break-word; }
        .msg-assistant { align-self: flex-start; max-width: 85%; color: #ececec; word-wrap: break-word; line-height: 1.6; }
        
        /* Chat Input Container */
        #input-container {
            padding: 20px 20%;
            background-color: transparent;
        }
        #input-box {
            background-color: #2f2f2f;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 8px 16px;
        }
        #chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            padding: 10px 5px;
            font-size: 1rem;
        }
        #chat-input::placeholder { color: #b4b4b4; }
        .input-icon {
            color: #b4b4b4;
            cursor: pointer;
            padding: 5px;
            font-size: 1.2rem;
        }
        .input-icon:hover { color: white; }

        /* Table styling for assistant responses */
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th, td { border: 1px solid #424242; padding: 8px; text-align: left; }
        th { background-color: #171717; }
        
        /* Login Screen */
        #login-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
    <!-- Marked.js for rendering markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- LOGIN OVERLAY -->
    <div id="login-screen">
        <h1 class="text-4xl font-bold mb-4">Master Sales Agent</h1>
        <p class="text-gray-400 mb-8">Please sign in with your @healthaids.in account</p>
        
        <!-- Google Sign-In Button Container -->
        <div id="g_id_onload"
             data-client_id="553062227505-29cqks8fromv8i5n8u1p64busueap6m5.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-hd="healthaids.in">
        </div>
        
        <div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-text="sign_in_with"></div>
        
        <p id="login-error" class="text-red-500 mt-4 hidden">Access Denied. You are not authorized to use this application.</p>
    </div>

    <!-- MAIN APP SCREEN (Hidden by default) -->
    <div id="app-screen" class="w-full h-full flex" style="display: none;">
        
        <!-- Thin Sidebar -->
        <div id="sidebar">
            <div style="font-size: 1.5rem; margin-bottom: 30px; cursor: pointer;">🤖</div>
            <div class="icon-btn" onclick="newChat()" title="New Chat">📝</div>
            <div class="icon-btn" title="Search">🔍</div>
            <div class="icon-btn" title="Pinned">📌</div>
            <div class="flex-grow"></div>
            <div class="icon-btn" title="Settings">⚙️</div>
        </div>

        <!-- Main Content -->
        <div id="main-container">
            <div id="chat-history">
                <!-- Empty state -->
                <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center mt-20">
                    <h1 id="user-greeting" class="text-3xl font-medium mb-8">Where should we begin?</h1>
                    <div class="border border-gray-600 rounded-full px-4 py-2 text-sm text-gray-400 cursor-pointer hover:bg-gray-800">What can you do?</div>
                </div>
            </div>

            <div id="input-container">
                <div id="input-box">
                    <div class="input-icon mr-2">➕</div>
                    <input type="text" id="chat-input" placeholder="Ask anything" autocomplete="off" onkeypress="handleEnter(event)">
                    <div class="input-icon ml-2">🎧</div>
                </div>
            </div>
        </div>
        
    </div>

    <script>
        let sessionId = crypto.randomUUID();
        let userName = "Sam";
        let userEmail = "";
        let userIp = "unknown";
        let userGps = null;

        // Fetch IP on load
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => userIp = data.ip)
            .catch(e => console.error("Could not fetch IP", e));

        // Google Authentication Logic
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        function handleCredentialResponse(response) {
            const payload = parseJwt(response.credential);
            console.log("Logged in as:", payload.email);
            
            // Strict email whitelist
            const allowedEmails = ['rishab@healthaids.in', 'shivam.yadav@healthaids.in'];
            if (allowedEmails.includes(payload.email.toLowerCase())) {
                userName = payload.given_name;
                userEmail = payload.email;
                document.getElementById('user-greeting').innerText = `Where should we begin, ${userName}?`;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                
                // Update chat input placeholder
                document.getElementById('chat-input').placeholder = `Message ${userName}...`;

                // Request GPS Location
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => { userGps = { lat: position.coords.latitude, lng: position.coords.longitude }; },
                        (error) => { console.warn("GPS Denied or Unavailable", error); }
                    );
                }
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function newChat() {
            sessionId = crypto.randomUUID();
            document.getElementById('chat-history').innerHTML = `
                <div id="empty-state" class="flex flex-col items-center justify-center h-full text-center mt-20">
                    <h1 class="text-3xl font-medium mb-8">Where should we begin, ${userName}?</h1>
                    <div class="border border-gray-600 rounded-full px-4 py-2 text-sm text-gray-400 cursor-pointer hover:bg-gray-800">What can you do?</div>
                </div>
            `;
        }

        async function sendMessage() {
            const inputField = document.getElementById('chat-input');
            const message = inputField.value.trim();
            if (!message) return;

            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.remove();

            const chatHistory = document.getElementById('chat-history');

            const userBubble = document.createElement('div');
            userBubble.className = 'msg-user';
            userBubble.innerText = message;
            chatHistory.appendChild(userBubble);

            inputField.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const assistantBubble = document.createElement('div');
            assistantBubble.className = 'msg-assistant text-gray-400 italic';
            assistantBubble.innerHTML = 'Thinking...';
            chatHistory.appendChild(assistantBubble);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const userData = {
                    email: userEmail,
                    ip: userIp,
                    gps: userGps,
                    systemInfo: navigator.userAgent,
                    language: navigator.language
                };

                // If running on Vercel, this calls the proxy rewrite.
                // If running locally with server.py, it calls the local proxy.
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chatInput: message, 
                        sessionId: sessionId,
                        userData: userData 
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    let reply = "";
                    if (typeof data === 'object' && data !== null) {
                        reply = data.output || data.text || data.response || JSON.stringify(data);
                    } else {
                        reply = String(data);
                    }

                    assistantBubble.className = 'msg-assistant';
                    assistantBubble.innerHTML = marked.parse(reply);
                } else {
                    assistantBubble.className = 'msg-assistant text-red-500';
                    assistantBubble.innerHTML = `⚠️ Error ${response.status} from n8n`;
                }
            } catch (err) {
                assistantBubble.className = 'msg-assistant text-red-500';
                assistantBubble.innerHTML = `⚠️ Connection error: ${err.message}`;
            }

            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
